name: Create Release Package

# Run when a new tag is pushed (e.g., v1.0.0) -- e.g. by a human pushing a
# tag with their own git credentials. The "Cut Release" workflow (see
# cut-release.yml) is the intended way to ship a new version, and calls
# build-and-publish.yml directly rather than relying on this trigger,
# since a tag pushed using the default GITHUB_TOKEN does not fire it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/build-and-publish.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
